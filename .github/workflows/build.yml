name: Build

on:
  pull_request:
    branches: ['*']

jobs:
  build:
    name: Build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S .

      - name: Build
        run: cmake --build build
